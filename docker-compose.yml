services:
  catalog.api:
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile
    container_name: catalog.api
    ports:
      - "5432:5432"
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres
    container_name: postgres_catalog
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: