services:
  catalog.api:
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile
    container_name: catalog.api
    depends_on:
      - postgres_catalog

  basket.api:
    build:
      context: .
      dockerfile: Services/Basket/Basket.api/Dockerfile
    container_name: basket.api
    depends_on:
      - postgres_basket

  postgres_catalog:
    image: postgres
    container_name: postgres_catalog
    volumes:
      - postgres_catalog_data:/var/lib/postgresql

  postgres_basket:
    image: postgres
    container_name: postgres_basket
    volumes:
      - postgres_basket_data:/var/lib/postgresql

volumes:
  postgres_catalog_data:
  postgres_basket_data: