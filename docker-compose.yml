services:
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.Api/Dockerfile
    container_name: catalog.api
    depends_on:
      postgres_catalog:
        condition: service_healthy

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    container_name: basket.api
    depends_on:
      postgres_basket:
        condition: service_healthy
      distributed_cache:
        condition: service_healthy
      discount.grpc:
        condition: service_started
      messagebroker:
        condition: service_healthy

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    container_name: discount.grpc

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.Api/Dockerfile
    container_name: ordering.api
    depends_on:
      sqlserver_ordering:
        condition: service_healthy
      messagebroker:
        condition: service_healthy

  postgres_catalog:
    image: postgres:16
    container_name: postgres_catalog
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
  messagebroker:
    image: rabbitmq:management
    container_name: messagebroker
    volumes:
      - messagebroker_data:/var/lib/rabbitmq
  postgres_basket:
    image: postgres:16
    container_name: postgres_basket
    volumes:
      - postgres_basket_data:/var/lib/postgresql/data

  sqlserver_ordering:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_ordering
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Ordering@Pass1
    volumes:
      - sqlserver_ordering_data:/var/opt/mssql

  distributed_cache:
    image: redis:7
    container_name: distributed_cache

  yarp.gateway:
    image: ${DOCKER_REGISTRY-}yarpgateway
    build:
      context: .
      dockerfile: APIGETWays/YarpGateway/Dockerfile
    container_name: yarp.gateway
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api

volumes:
  postgres_catalog_data:
  postgres_basket_data:
  discount_data:
  messagebroker_data:
  sqlserver_ordering_data: